<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCT EEE CGPA Calculator(R21)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JCT CET CGPA Calculator(R21)</h1>
            <h2>B.E. Electrical and Electronics Engineering</h2>
        </div>

        <div class="calculator">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('gpa', event)">GPA</button>
                <button class="mode-btn" onclick="setMode('cgpa', event)">CGPA</button>
            </div>

            <!-- GPA mode: single selector -->
            <div class="semester-selector" id="gpaSemesterSelector">
                <select id="semesterSelect" onchange="loadSubjects()">
                    <option value="">Select Semester</option>
                </select>
            </div>

            <!-- CGPA mode: from/to selectors — now equal width, single row -->
            <div class="cgpa-range-selector" id="cgpaSemesterSelector" style="display:none;">
                <select id="semesterFrom" onchange="onRangeChange()">
                    <option value="">From Semester</option>
                </select>
                <select id="semesterTo" onchange="onRangeChange()">
                    <option value="">To Semester</option>
                </select>
            </div>

            <div id="subjectGrid" class="subject-grid"></div>

            <button id="calculateBtn" class="calculate-btn" onclick="calculate()">Calculate GPA</button>

            <div id="results" class="results">
                <div class="results-header">
                    <h3>Results</h3>
                   <select id="exportSelector" class="export-img-btn" onchange="handleExport(this)">
    <option value="" disabled selected>Download Results...</option>
    <option value="image">Download as Image</option>
    <option value="pdf">Download as PDF</option>
</select>
                </div>
                <p id="arrear-warning" class="arrear-note">
                    ⚠ Subjects with U / W / SA grades are excluded from the CGPA denominator per Anna University regulations.
                </p>
                <p><span id="result-label">GPA for selected semester</span>: <strong><span id="gpa-result" style="color:--text;font-size:1.4rem;">0.00</span></strong></p>
                <p>Credits counted: <span id="total-credits">0</span></p>
                <div id="semester-gpa-breakdown" style="display:none;">
                    <h4>Semester-wise GPA Breakdown:</h4>
                    <div id="semester-gpa-list"></div>
                </div>
                <div class="chart-container">
                    <canvas id="gradesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden div used for image export rendering -->
    <div id="result-card"></div>

   <script src="scripts.js"></script>
</body>
</html>
